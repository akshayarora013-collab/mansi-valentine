<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Mansi 💕</title>

<style>
body {
    background: linear-gradient(#ffe6f0, #fff0f5);
    font-family: "Comic Sans MS", "Arial", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.mail-box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 330px;
    text-align: center;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
    position: relative;
}

h2 {
    color: #ff4d88;
}

.heart {
    font-size: 24px;
    animation: float 2s infinite ease-in-out;
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0); }
}

.buttons {
    margin-top: 30px;
    position: relative;
    height: 120px;
}

#yesBtn {
    padding: 16px 45px;
    font-size: 18px;
    background-color: #ff4d88;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: transform 0.2s;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    padding: 10px 25px;
    font-size: 14px;
    background-color: #ffd6e6;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    position: absolute;
}

#message {
    display: none;
    margin-top: 20px;
    font-size: 18px;
    color: #ff4d88;
}
</style>
</head>

<body>

<div class="mail-box">
    <h2>📩 A Cute Little Mail for Mansi</h2>
    <div class="heart">💖</div>
    <p>Hi Mansi 🥺</p>
    <p>Just a tiny question from someone who smiles every time he thinks of you…</p>
    <p><b>Will you be my Valentine? 💕</b></p>

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">YES 🐻💘</button>
        <button id="noBtn" onmouseover="moveNo()">NO 🙈</button>
    </div>

    <div id="message">
        YAYYYY!!! 🥰💞  
        Mansi, you just made my heart do a happy dance 💃🕺  
        <br><br>
        — Your Secret Admirer (Akshay) 🐻💕
    </div>
</div>

<script>
function moveNo() {
    const noBtn = document.getElementById("noBtn");

    const x = Math.floor(Math.random() * 220);
    const y = Math.floor(Math.random() * 90);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

function sayYes() {
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
